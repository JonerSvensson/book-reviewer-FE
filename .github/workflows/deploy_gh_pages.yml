name: Deploy to Github Pages

on:
    push:
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Upload files
              uses: actions/upload-pages-artifact@v5
              with:
                path: '.'

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        runs-on: ubuntu-latest
        needs: build

        permissions:
            pages: write
            id-token: write

        steps:
            - name: Deploy to gh pages
              id: deployment
              uses: actions/deploy-pages@v5